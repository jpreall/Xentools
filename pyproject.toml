[project]
name = "xentools"
version = "0.1.0"
description = "Tools for reading, plotting, and manipulating Xenium and Atera spatial transcriptomics outputs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jonathan Preall", email = "jpreall@cshl.edu"}]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scanpy",
    "anndata",
    "geopandas",
    "shapely",
    "zarr>=2.18.3",
    "numcodecs",
    "dask",
    "xarray",
    "Pillow",
    "tifffile",
    "imagecodecs",
    "scikit-learn",
    "pyarrow",
    "h5py",
    "ipython",
    "ipywidgets",
]

[project.optional-dependencies]
test = [
    "pytest",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

[tool.setuptools]
package-dir = {"xentools" = "."}
packages = [
    "xentools",
    "xentools.analysis",
    "xentools.core",
    "xentools.io",
    "xentools.io.read",
    "xentools.io.write",
    "xentools.gene_sets",
    "xentools.pl",
    "xentools.utils",
]

[tool.setuptools.package-data]
xentools = [
    "files/gene_lists/*.h5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
