[project]
name = "xentools"
version = "0.1.0"
description = "Tools for reading, plotting, and manipulating Xenium and Atera spatial transcriptomics outputs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jonathan Preall", email = "jpreall@cshl.edu"}]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scanpy",
    "anndata",
    "geopandas",
    "shapely",
    "zarr>=2.18.3",
    "dask",
    "xarray",
    "Pillow",
    "tifffile",
    "imagecodecs",
    "scikit-learn",
    "pyarrow",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
